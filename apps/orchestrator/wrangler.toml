# Cloudflare Worker configuration for the orchestrator.
#
# The Worker replaces the Express server that used to run on :5181. `src/worker.ts` is the
# entry point; `src/server.ts` still exists for the Node dev path (see `npm run dev`), and
# both mount the same Hono app from `src/app.ts` so the two cannot drift.
#
# Secrets are never written here. `LLM_KITA_API_KEY` is set with
#   wrangler secret put LLM_KITA_API_KEY        (deployed)
#   .dev.vars                                    (local, gitignored)

name = "rakit-orchestrator"
main = "src/worker.ts"
compatibility_date = "2025-01-01"

# `nodejs_compat` is deliberately NOT enabled. The three Node dependencies the old code had
# (`node:crypto` for ids, `process.env` for config, `unref()` on timers) were removed rather
# than polyfilled: `crypto.randomUUID()`, `crypto.subtle`, and bindings are available natively,
# and a polyfill would hide the next Node-only API someone reaches for.

[observability]
enabled = true

# D1 binding. The `database_id` is a public identifier, not a secret — it names the database,
# it does not grant access to it. Access comes from the Worker's own binding.
#
# This database holds *platform* metadata: the projects the editor lists and their revisions.
# It is NOT the per-user-project database described in the PRD — those are separate D1
# instances provisioned later, one per published app.
[[d1_databases]]
binding = "DB"
database_name = "rakit-db"
database_id = "0a8f0b2e-1949-4388-9c8b-3567a3f33120"

# Non-secret configuration. Secrets go in `wrangler secret`, never here.
[vars]
# Generation is OFF in the deployed Worker until Auth exists.
#
# Written out rather than left absent so the safe state is greppable: an operator reading this
# file should not have to know the default to know whether the paid endpoints are reachable.
# While this is "false", `/generate` and `/revise` answer 503 FEATURE_DISABLED, and only the
# exact string "true" enables them.
#
# Enabling this exposes an endpoint that spends LLM-Kita quota to anyone who calls it —
# `RAKIT_SHARED_TOKEN` is inlined into the editor's browser bundle, so it stops crawlers and
# nothing else. Flip it for a deliberate test and set it back.
FEATURE_GENERATE_ENABLED = "false"
# The API lives on its own host, under `/api/v1` — NOT on the marketing site at
# `https://llm-kita.com`, which answers every POST with 405 because it serves static HTML.
# The client appends `/chat/completions` to this value, so the `/v1` must stay here and must
# not be repeated in code.
LLM_KITA_BASE_URL = "https://api.llm-kita.com/api/v1"
# `auto` lets the gateway pick the model. The earlier `kita-default` was invented during setup
# and was never a real model id.
LLM_KITA_MODEL = "gpt-6-luna"
LLM_TIMEOUT_MS = "60000"
LLM_MAX_TOKENS_GENERATE = "8000"
LLM_MAX_TOKENS_REVISE = "12000"

# Browser origins allowed to call this API.
#
# CORS is a browser rule, not an access control: `curl` ignores it entirely, so this list stops
# a page on another origin from calling the API with a user's browser — it does not stop anyone
# else. The controls that do are the shared token and FEATURE_GENERATE_ENABLED above.
#
# Still an allowlist rather than a wildcard, and an empty value denies every browser origin.
# Never replace this with `*` to "make it work": that lets any page on the internet drive the
# deployed Worker and bill the LLM-Kita account behind it.
#
# `*.pages.dev` subdomains are the Cloudflare Pages preview URLs, which change on every deploy;
# the wildcard keeps previews working. Add the custom domain here when one exists.
CORS_ALLOWED_ORIGINS = "http://localhost:5180,http://127.0.0.1:5180,*.rakit-editor.pages.dev"
